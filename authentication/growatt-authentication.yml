notes: >-
  Growatt Open API V1 uses a static API token issued to the account. The token is
  sent on every request in a `token` HTTP header. Tokens are obtained by an account
  holder from the Growatt Open API console (openapi.growatt.com). The legacy
  ShinePhone API instead used username/password (MD5) session login; V1 token auth
  is the officially supported, recommended mechanism.
