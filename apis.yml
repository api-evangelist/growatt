name: Growatt
description: 'Growatt New Energy is a global manufacturer of solar PV inverters, energy storage
  systems, and smart energy management products for residential, commercial, and utility-scale
  installations. Growatt operates the ShineServer / ShinePhone cloud monitoring platform and
  publishes a token-authenticated Open API (V1) that lets third-party systems read plant and
  device telemetry, retrieve historical energy data, and read or write inverter parameters for
  MIN (TLX) string inverters and SPH (MIX) hybrid inverters across regional endpoints. Originally
  surfaced as a portfolio company of IDG Capital; enriched from Growatt''s public developer surface.'
